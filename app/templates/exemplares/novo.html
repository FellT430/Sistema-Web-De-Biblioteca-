{% extends "base.html" %}
{% block title %}Novo exemplar{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Novo exemplar</h1>

  <form method="post" class="col-lg-6">
    <div class="mb-3">
      <label for="livro_id" class="form-label">Livro *</label>
      <select class="form-select" id="livro_id" name="livro_id" required>
        <option value="" selected disabled>Selecione um livro</option>
        {% for livro in livros %}
          <option value="{{ livro.id }}">{{ livro.titulo }} — {{ livro.autor }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label for="codigo_patrimonio" class="form-label">Código de patrimônio *</label>
      <input type="text" class="form-control" id="codigo_patrimonio" name="codigo_patrimonio" required>
    </div>
    <p class="text-muted small">O exemplar é criado automaticamente com status "Disponível".</p>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('exemplares.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
{% endblock %}
