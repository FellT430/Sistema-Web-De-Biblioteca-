{% extends "base.html" %}
{% block title %}Novo livro{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Novo livro</h1>

  <form method="post" class="col-lg-6">
    <div class="mb-3">
      <label for="titulo" class="form-label">Título *</label>
      <input type="text" class="form-control" id="titulo" name="titulo" required>
    </div>
    <div class="mb-3">
      <label for="autor" class="form-label">Autor *</label>
      <input type="text" class="form-control" id="autor" name="autor" required>
    </div>
    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN</label>
      <input type="text" class="form-control" id="isbn" name="isbn">
    </div>
    <div class="mb-3">
      <label for="ano_publicacao" class="form-label">Ano de publicação</label>
      <input type="number" class="form-control" id="ano_publicacao" name="ano_publicacao" min="0">
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('livros.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
{% endblock %}
