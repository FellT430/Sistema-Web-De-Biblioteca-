{% extends "base.html" %}

{% block titulo %}{{ titulo }} - Livro +{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4 text-center">
            <div class="card-body p-5">
                <div class="display-4 fw-bold text-secondary">{{ codigo }}</div>
                <h3 class="mt-2">{{ titulo }}</h3>
                <p class="text-muted mb-4">{{ mensagem }}</p>
                <a href="{{ url_for('auth.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
                   class="btn btn-primary">Voltar ao início</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
